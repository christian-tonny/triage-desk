[project]
name = "triage-desk"
version = "0.1.0"
description = "Deterioration watch for hospital outpatient waiting rooms: deterministic mSATS/TEWS scoring, open-weights LLM intake, nurse-approved actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",
    "langgraph>=0.4,<2",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage_desk.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage_desk", "servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
